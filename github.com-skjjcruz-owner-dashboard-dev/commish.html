<!--
  DHQ Commissioner Calculator, Lab edition (owner rulings 2026-11-14 / 15).
  League-free: pick your league's scoring (PPR / Half / Standard, passing TD,
  TE premium, league size, superflex), try any rule change, and every NFL
  player's real season is rescored under both and compared: positions,
  rankings, biggest movers, a range sweep, a summary and a share link. No
  league, no Sleeper username. Scoring is the method ported from C2 War
  Room's Rule Lab (copied, the C2 repos untouched). Reads only Sleeper's
  public stats and player list. Published to the Lab as commish.html by
  scripts/publish-lab.cjs and gated like every page.
-->
<style>
:root{
  color-scheme:dark;
  --page:#08080B; --off-black:#1B1B22; --panel:rgba(16,16,22,.96); --charcoal:#27262E;
  --white:#F5F2EA; --silver:#BDB8AD; --soft:rgba(207,207,214,.88); --faint:rgba(189,184,173,.6);
  --gold:#D4AF37; --good:#2ECC71; --warn:#F0A500; --bad:#E74C3C; --info:#5DADE2;
  --send:#5dade2; --get:#e74c3c;
  --line:rgba(212,175,55,.16); --line2:rgba(212,175,55,.25); --hair:rgba(255,255,255,.06);
  --r-xs:5px; --r-sm:8px; --r:10px; --r-lg:14px;
  --display:'Rajdhani','Arial Narrow',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{background:var(--page)}
body{margin:0;color:var(--white);font:14.5px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.brandwash{position:fixed;inset:0;z-index:0;pointer-events:none;background:url("img/logo.png") no-repeat center 16%/min(720px,86vw) auto;opacity:.07;mix-blend-mode:screen;filter:blur(4px);-webkit-mask-image:radial-gradient(125% 105% at 50% 20%,#000 26%,transparent 74%);mask-image:radial-gradient(125% 105% at 50% 20%,#000 26%,transparent 74%)}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:calc(12px + var(--sat)) 12px;box-shadow:0 0 0 100vmax var(--page),0 1px 0 100vmax #ffffff18;clip-path:inset(0 -100vmax -1px)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--white)}
.brand img{width:44px;height:44px;border-radius:var(--r);box-shadow:0 2px 12px rgba(212,175,55,.3)}
.brand span{font:700 20px/1 var(--display);letter-spacing:.06em}
.back{color:#98A1AD;text-decoration:none;font-size:14px;padding:10px 14px;border:1px solid #232932;border-radius:var(--r-sm)}
.back:hover{color:var(--white);border-color:#333A45}

/* the panel */
.panel{margin:28px 0 0;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:18px 20px 20px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid rgba(212,175,55,.12)}
.panel-head h1,.panel-head h2{margin:0;color:var(--gold);font:700 19px/1.1 var(--display);letter-spacing:.1em;text-transform:uppercase}
.panel-head em{color:var(--faint);font-size:13.5px}
.source{margin:14px 0;color:var(--soft);font-size:14px}
.source b{color:var(--gold);font-weight:600}
.source .est{color:var(--faint)}

.sel{background:var(--charcoal);border:1px solid var(--line2);color:var(--white);font:500 13.5px var(--body);padding:9px 10px;border-radius:var(--r-xs);cursor:pointer;width:100%}
.sel:focus{outline:none;border-color:var(--gold)}
.league{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.foot-note{margin:16px 0 40px;font-size:12px;line-height:1.6;color:var(--faint)}
.loading{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:13.5px;padding:12px}
.loading::before{content:"";width:13px;height:13px;border-radius:50%;border:2px solid var(--gold);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#F1948A;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;background:var(--off-black);border:1px solid var(--line2);padding:10px 16px;border-radius:var(--r-sm);font-size:14px;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.wrap{max-width:1240px}
.face{width:32px;height:32px;border-radius:50%;flex:none;overflow:hidden;background:#15151b;box-shadow:0 0 0 1.5px var(--pc,var(--silver));display:inline-block;position:relative}
.face img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 15%}
.av{width:30px;height:30px;border-radius:50%;flex:none;overflow:hidden;background:#2a2932;display:inline-grid;place-items:center;font:700 12px var(--display);color:var(--silver);position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.lg{width:52px;height:52px;font-size:20px;border-radius:var(--r)}
.muted{color:var(--faint)}
.gold{color:var(--gold)}
.pos-up{color:#7DDCA3} .pos-dn{color:#F1948A}
button{cursor:pointer}

/* ── find your league ── */
.setrow{display:grid;gap:10px}
.allrules{margin-top:2px}
.allrules summary{cursor:pointer;font-size:12.5px;color:var(--faint)}
.allrules summary:hover{color:var(--white)}
.rulegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 16px;margin-top:10px;font-size:12.5px;color:var(--soft)}
.rulegrid span{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--hair)}
.rulegrid b{color:var(--white);font-weight:600;white-space:nowrap}
.pos2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lg-on{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid rgba(212,175,55,.45);border-radius:var(--r-sm);background:rgba(212,175,55,.08)}
.lg-on b{display:block;color:var(--gold);font-weight:700}
.lg-on small{display:block;color:var(--soft);font-size:12px;margin-top:2px}
.lg-find{display:flex;align-items:center;gap:8px;flex:1 1 420px;max-width:560px;justify-content:flex-end}
.lg-find>span{font-size:13px;color:var(--soft);white-space:nowrap}
.lg-find input,.psearch input{background:var(--charcoal);border:1px solid var(--line2);color:var(--white);font:400 14px var(--body);padding:9px 12px;border-radius:var(--r-xs);min-width:220px;flex:1}
.lg-find input:focus,.psearch input:focus{outline:none;border-color:var(--gold)}
.psearch{position:relative;flex:1 1 220px;min-width:0;max-width:100%;display:flex;flex-direction:column}
.psug{width:100%;max-width:100%;min-width:0;contain:inline-size;box-sizing:border-box;margin-top:6px;background:#1d1c23;border:1px solid rgba(212,175,55,.3);border-radius:var(--r-sm);padding:4px;max-height:300px;overflow:auto;overscroll-behavior:contain}
.psug[hidden]{display:none}
.psug .sug-cols{display:grid;gap:10px;align-items:end;padding:4px 8px 8px;font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--hair);margin-bottom:4px;min-width:max-content;width:100%;box-sizing:border-box}
.psug .sug-cols span{text-align:right}
.psug .sug-cols span:first-child{text-align:left}
.psug .sug-cols .c{color:var(--soft);white-space:normal;line-height:1.2}
.psug .sug-cols small{display:block;margin-top:2px;font:600 11px var(--body);letter-spacing:0;text-transform:none;color:var(--gold)}
.psug .sug-cols .t{color:var(--gold)}
.psug button.sug-row{display:grid;gap:10px;align-items:center;min-width:max-content;width:100%}
.psug .sug-row .who{display:flex;align-items:center;gap:10px;min-width:0}
.psug .sug-row .who > span:not(.face){min-width:0;overflow:hidden}
.psug .sug-row .who b,.psug .sug-row .who small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psug .sug-row > *,.psug .sug-cols > *{min-width:0}
.psug .sug-row .n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.psug .sug-row .n.t{color:var(--gold);font-weight:700}
@media (max-width:640px){.psug button.sug-row,.psug .sug-cols{gap:6px;padding-left:4px;padding-right:4px}.psug .sug-row .face{width:28px;height:28px}.psug .sug-row b{font-size:12.5px}.psug .sug-row .n{font-size:12.5px}.psug .sug-cols{font-size:9px;letter-spacing:.04em}.psug .sug-cols small{font-size:10px}}
.psug .sug-head{position:sticky;top:-4px;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 8px;margin:-4px -4px 4px;background:#1d1c23;border-bottom:1px solid var(--hair)}
.psug .sug-head .cc-hint{margin:0}
.psug button.sug-done{display:inline-flex;width:auto;padding:7px 12px;color:#16130a;background:var(--gold);border-color:var(--gold)}
.psug button.sug-done:hover{background:var(--gold)}
.pb-list.watched{align-items:center;margin-bottom:8px}
.pb-list.watched .lbl{font:600 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.psug button{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:0;background:transparent;color:var(--white);text-align:left;border-radius:var(--r-xs)}
.psug button:hover{background:rgba(212,175,55,.1)}
.psug b{display:block;font-size:13.5px;font-weight:600}
.psug button > span:not(.face){flex:1;min-width:0}
.psug .face{width:34px;height:34px}
.psug em{font-style:normal;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.psug button.on{opacity:.45}
.wpos{flex-basis:100%}
.psug small{display:block;font-size:11.5px;color:var(--faint)}
.pb-item.wp{padding-left:6px}
.pb-item.wp .face{width:24px;height:24px}
#teamPick{background:var(--charcoal);border:1px solid var(--line2);color:var(--white);font:500 13.5px var(--body);padding:9px 10px;border-radius:var(--r-xs);max-width:100%}
.movesgrid{display:grid;gap:8px;font-size:13px}
.movesgrid b{display:inline-block;min-width:34px}
.movesgrid span{margin-right:10px}
.more{display:block;width:100%;padding:12px;border:0;background:transparent;color:var(--gold);font:600 13px var(--body);cursor:pointer;border-top:1px solid var(--hair)}
.more:hover{background:rgba(212,175,55,.06)}
.cc-find{display:grid;gap:14px;margin:6px 0 4px}
.cc-find[hidden]{display:none}
.cc-find form{display:flex;gap:10px;flex-wrap:wrap}
.cc-find .in{position:relative;flex:1;min-width:240px}
.cc-find input{width:100%;background:var(--charcoal);border:1px solid var(--line2);color:var(--white);font:400 15px var(--body);padding:13px 14px 13px 42px;border-radius:var(--r-sm)}
.cc-find input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
.cc-find input::placeholder{color:rgba(255,255,255,.3)}
.cc-find .in svg{position:absolute;left:14px;top:50%;width:17px;height:17px;transform:translateY(-50%);stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.btn{border:1px solid var(--line2);background:var(--charcoal);color:var(--white);font:600 14px var(--body);padding:12px 18px;border-radius:var(--r-sm);white-space:nowrap}
.btn:hover{border-color:rgba(212,175,55,.5)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#17140a}
.btn.gold:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:8px 12px;font-size:12.5px}
.cc-hint{font-size:12.5px;color:var(--faint);margin:0}
.cc-leagues{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cc-lg{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(39,38,46,.8),rgba(22,22,28,.9));text-align:left;color:var(--white)}
.cc-lg:hover{border-color:rgba(212,175,55,.55);transform:translateY(-1px)}
.cc-lg b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-lg small{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.cc-lg > span:nth-child(2){min-width:0;flex:1}
.cc-msg{padding:12px 14px;border-radius:var(--r-sm);background:var(--charcoal);border:1px solid var(--line);font-size:13.5px;color:var(--soft)}
.cc-msg.err{border-color:rgba(231,76,60,.4);color:#F1948A}

/* ── the league banner ── */
.cc-league{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;margin:4px 0 14px;border:1px solid rgba(212,175,55,.3);border-radius:var(--r);background:linear-gradient(100deg,rgba(212,175,55,.12),rgba(212,175,55,.02) 65%)}
.cc-league[hidden]{display:none}
.cc-league .t{min-width:0;flex:1}
.cc-league h2{margin:0;font:700 24px/1.05 var(--display);letter-spacing:.03em;color:var(--white)}
.cc-league .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--silver);background:rgba(0,0,0,.28);border:1px solid var(--hair);border-radius:var(--r-xs);padding:3px 7px}
.tag.gold{color:var(--gold);border-color:rgba(212,175,55,.35)}

/* ── tabs and season chips ── */
.cc-tabs{display:flex;gap:4px;border-bottom:1px solid rgba(212,175,55,.16);margin:2px 0 14px;overflow-x:auto}
.cc-tabs button{flex:none;border:0;background:transparent;color:var(--faint);font:600 14px var(--body);padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.cc-tabs button:hover{color:var(--white)}
.cc-tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.cc-tabs svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font:600 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.chip{border:1px solid var(--line2);background:var(--charcoal);color:var(--silver);font:600 12.5px var(--body);padding:7px 11px;border-radius:var(--r-xs)}
.chip:hover{color:var(--white);border-color:rgba(212,175,55,.45)}
.chip[aria-pressed="true"]{background:rgba(212,175,55,.16);color:var(--gold);border-color:rgba(212,175,55,.55)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip small{font-weight:500;color:var(--faint);margin-left:4px}
.sec{margin:0 0 16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 10px}
.sec-h h3{margin:0;font:700 16px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.sec-h p{margin:0;font-size:12.5px;color:var(--faint)}
.card{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(39,38,46,.7),rgba(20,20,26,.9));padding:14px 16px}
.loading-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:8px}
.loading-bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}

/* ── proposal builder ── */
.pb{display:grid;gap:12px}
.pb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pb select,.pb input[type=number]{background:var(--charcoal);border:1px solid var(--line2);color:var(--white);font:500 13.5px var(--body);padding:9px 10px;border-radius:var(--r-xs)}
.pb select{max-width:100%;min-width:220px;flex:1}
.pb input[type=number]{width:110px}
.pb select:focus,.pb input:focus{outline:none;border-color:var(--gold)}
.pb .cur{font-size:12.5px;color:var(--faint)}
.pb-list{display:flex;flex-wrap:wrap;gap:8px}
.pb-item{display:inline-flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;border-radius:var(--r-sm);background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.45);font-size:13px}
.pb-item b{font-weight:600}
.pb-item .ar{color:var(--gold);font-weight:700}
.pb-item button{width:30px;height:30px;flex:none;margin:-4px -2px -4px 0;font-size:16px!important;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:var(--silver);font-size:13px;line-height:1;display:grid;place-items:center}
.pb-item button:hover{color:var(--white);background:rgba(231,76,60,.5)}
.pb-empty{font-size:13px;color:var(--faint)}
.pb-listbox{display:grid;gap:8px;padding:12px;border:1px dashed var(--line2);border-radius:var(--r-sm);background:rgba(0,0,0,.18)}
.pb-listbox > .lbl{font:600 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.pb-item.waiting{border-style:dashed;background:rgba(212,175,55,.05)}
.pb-item small{font:600 9.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--warn);margin-left:2px}
.pb-go .btn.gold{padding:13px 22px;font-size:15px}
.pb-go{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* ── verdict ── */
.verdict{display:grid;gap:12px;padding:18px 20px;border:1px solid rgba(212,175,55,.5);border-radius:var(--r-lg);background:linear-gradient(110deg,rgba(212,175,55,.18),rgba(212,175,55,.03) 70%);box-shadow:0 14px 44px rgba(0,0,0,.35)}
.verdict .k{font:700 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.verdict h2{margin:0;font:700 clamp(22px,3.2vw,32px)/1.08 var(--display);letter-spacing:.02em;color:var(--white)}
.verdict h2 span{color:var(--gold)}
.verdict .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.fact{padding:10px 12px;border-radius:var(--r-sm);background:rgba(0,0,0,.28);border:1px solid var(--hair)}
.fact span{display:block;font:600 10px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.fact b{display:block;margin-top:3px;font:700 19px/1.15 var(--display);color:var(--white)}
.fact small{display:block;margin-top:2px;font-size:12px;color:var(--soft);line-height:1.35}
.fact.hot{border-color:rgba(212,175,55,.5);background:rgba(212,175,55,.1)}
.fact.hot b{color:var(--gold)}
.verdict .vsub{margin:-4px 0 0;font-size:16px;color:var(--white)}
.verdict .vlist{margin:2px 0 0;padding-left:18px;display:grid;gap:5px;font-size:14px;color:var(--soft)}
.verdict .vlist b{color:var(--white);font-weight:600}
.pchg{display:grid;gap:6px}
.pc-row{display:grid;grid-template-columns:48px 190px minmax(0,1fr) 92px;align-items:center;gap:12px;padding:8px 6px;border-radius:var(--r-sm);font-size:14px}
.pc-row+.pc-row{border-top:1px solid var(--hair)}
.pc-pos{font:700 15px var(--display);letter-spacing:.04em}

.brand img{border-radius:var(--r,10px);box-shadow:0 2px 12px rgba(212,175,55,.3)}

  .brand{gap:9px}.brand img{width:34px;height:34px;border-radius:var(--r,10px);box-shadow:0 2px 12px rgba(212,175,55,.3)}

  .back{min-height:44px;padding:0 14px;font-size:13px;border-radius:30px}

    // players: { pid: [name, pos, team] }

        var open = ST.why === 'r' + x.pid;
        return '<tr class="tap' + (open ? ' open' : '') + '" data-why="r' + esc(x.pid) + '" tabindex="0" aria-expanded="' + open + '"><td class="c"><span class="rk">' + now + '</span><span class="mv-m">' + mv + '</span></td><td class="c hide-m">' + mv + '</td><td class="l"><span class="team" data-card="' + esc(x.pid) + '" title="Open ' + esc(x.name) + '\u2019s player card">' + headshot(x.pid, x.pos) + '<span><b>' + esc(x.name) + '</b><small>' + esc(x.team || '') + ' · ' + x.gp + ' games</small></span></span></td>'
          + '<td><b style="color:' + POS_COLOR[x.pos] + '">' + x.pos + x.posRankAfter + '</b>' + (x.posRankAfter !== x.posRankBefore ? '<small class="was">was ' + x.pos + x.posRankBefore + '</small>' : '') + '</td><td>' + fmt1(x.before) + '</td>' + keys.map(function (k) { return chgCell(effect(x.pid, k)); }).join('') + '<td class="tot"><b>' + fmt1(x.after) + '</b></td></tr>'
          + (open ? '<tr class="whyrow"><td colspan="' + (6 + keys.length) + '">' + whyBox(x, keys) + '</td></tr>' : '');
      }).join('') + '</tbody></table>' + (list.length > ST.shown ? '<button type="button" class="more" id="more">Show more (' + (list.length - ST.shown) + ' left)</button>' : '') + '</div>';
    // tipping point + summary
    var one = keys.length === 1;
    html += '<div class="sec-h"><h3>Try a range</h3><p>' + (one ? 'Run ' + esc(ruleName(keys[0])) + ' through a range of values and see how much of the scoring each position gets at each one.' : 'Works with one rule change at a time.') + '</p></div>'
      + '<div class="card"><button type="button" class="btn sm" id="sweepBtn"' + (one ? '' : ' disabled') + '>Run the range</button><div id="sweep"></div></div></div>'
      + '<div class="sec-h"><h3>Take it to the league</h3><p>A plain-text summary for the group chat, plus a link that opens this exact comparison.</p></div><div class="card pb-go"><button type="button" class="btn sm gold" id="copySum">Copy the summary</button><button type="button" class="btn sm" id="copyLink">Copy the link</button></div>';
    box.innerHTML = html;
    ST._last = { R: R, gainers: gainers, losers: losers, pc: pc, N: N, byAfter: byAfter, byBefore: byBefore, change: change };
    if (ST.sweep && ST.sweep.sig === sig()) drawSweep(ST.sweep.rows, ST.sweep.key);
    $('how').innerHTML = HOW;
  }
  var HOW = '<b>How it works.</b> Every NFL player’s real season is scored twice from Sleeper’s official stats: once under your rules, once with your change. Only the difference is shown. Your starting rules are Sleeper’s PPR, Half-PPR or Standard (checked against Sleeper’s own season totals: every QB, RB and TE matches exactly) with the usual kicker and team-defense scoring. Starters are what a league of your size fields: QB, 2 RB, 2 WR, TE, a FLEX, K and DEF per team (plus a second QB in superflex, and the league\u2019s own DL, LB, DB and IDP flex spots when a linked league starts IDP players). Every number is a full season of points.';
  function sig() { return [ST.year, ST.base, ST.passTd, ST.tep, ST.teams, ST.sf, Object.keys(ST.proposal).map(function (k) { return k + ':' + ST.proposal[k]; }).join(',')].join('|'); }

  function runSweep() {
    var k = Object.keys(ST.proposal)[0]; if (!k) return;
    var vals = CC.sweepValues(Number(rules()[k]) || 0, ST.proposal[k]);
    var rows = CC.sweep(ST.stats[ST.year], ST.players, rules(), k, vals, league());
    ST.sweep = { sig: sig(), rows: rows, key: k }; drawSweep(rows, k);
  }
  function drawSweep(rows, k) {
    var el = $('sweep'); if (!el) return;
    var cur = Number(rules()[k]) || 0, pos = ['QB', 'RB', 'WR', 'TE'];
    var cross = null;
    for (var i = 1; i < rows.length && !cross; i++) {
      pos.forEach(function (a) { pos.forEach(function (b) {
        if (cross || a === b) return;
        var p0 = rows[i - 1].share, p1 = rows[i].share;
        if (p0[a] < p0[b] && p1[a] >= p1[b] && Math.abs(p0[a] - p0[b]) < 15) cross = { a: a, b: b, at: rows[i].value };
      }); });
    }
    el.innerHTML = '<div class="scroll" style="margin-top:10px"><table class="tbl"><thead><tr><th class="l">' + esc(ruleName(k)) + '</th>' + pos.map(function (p) { return '<th>' + p + ' share</th>'; }).join('') + '<th class="l hide-m">#1 overall</th></tr></thead><tbody>'
      + rows.map(function (x) {
        var mark = x.value === cur ? ' <span class="pill dim">your rule</span>' : x.value === ST.proposal[k] ? ' <span class="pill in">your pick</span>' : '';
        return '<tr' + (cross && cross.at === x.value ? ' class="newin"' : '') + '><td class="l"><b>' + esc(ruleVal(k, x.value)) + '</b>' + mark + '</td>' + pos.map(function (p) { return '<td>' + x.share[p].toFixed(1) + '%</td>'; }).join('')
          + '<td class="l hide-m">' + (x.top ? esc(x.top.name) + ' <span class="muted">' + x.top.pos + '</span>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div><p class="cc-hint" style="margin-top:8px">' + (cross ? '<b class="gold">' + POS_NAME[cross.a] + ' pass ' + POS_NAME[cross.b] + '</b> in share of starter points at ' + esc(ruleVal(k, cross.at)) + '.' : 'No position passes another in this range.') + '</p>';
  }
  function summaryText() {
    var x = ST._last; if (!x) return '';
    var R = x.R, L = [];
    L.push('SCORING CHANGE CHECK (' + ST.year + ' season)');
    L.push('Starting rules: ' + { ppr: 'PPR', half: 'Half-PPR', std: 'Standard' }[ST.base] + ', ' + ST.passTd + '-pt passing TDs' + (ST.tep ? ', TE premium +' + ST.tep : '') + ' · ' + ST.teams + ' teams' + (ST.sf ? ', superflex' : ''));
    L.push('Change: ' + x.change);
    L.push('');
    L.push('Season points for the top ' + x.N + ' at each position: ' + x.pc.map(function (p) { return p.pos + ' ' + fmt1(p.before) + ' -> ' + fmt1(p.after) + ' (' + sgn(p.change) + ')'; }).join(', '));
    L.push('Total scoring: ' + sgn(R.totalPct) + '%');
    L.push('#1 overall: ' + x.byAfter[0].name + ' ' + x.byAfter[0].pos + (x.byAfter[0].pid !== x.byBefore[0].pid ? ' (was ' + x.byBefore[0].name + ' ' + x.byBefore[0].pos + ')' : ' (holds)'));
    if (x.gainers.length) L.push('Biggest winners: ' + x.gainers.slice(0, 4).map(function (m) { return m.name + ' +' + fmt1(m.delta); }).join(', '));
    if (x.losers.length) L.push('Biggest losers: ' + x.losers.slice(0, 4).map(function (m) { return m.name + ' ' + fmt1(m.delta); }).join(', '));
    L.push('');
    L.push('Every player’s real season scored twice from official stats; the difference is the rule change alone.');
    L.push('See it: ' + location.href);
    return L.join('\n');
  }
  function copy(text, msg) {
    var done = function () { toast(msg || 'Copied.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, msg); });
    else fallbackCopy(text, msg);
  }
  function fallbackCopy(text, msg) {
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(msg || 'Copied.'); } catch (e) { toast('Copy failed: select the text and copy it.'); }
    ta.remove();
  }

  // Everything that changes a setting goes through here.
  function update(keepSweep) {
    cleanProposal(); setHash();
    if (!keepSweep) ST.sweep = ST.sweep && ST.sweep.sig === sig() ? ST.sweep : null;
    renderSetup();
    if (!ST.stats[ST.year] || !ST.players) {
      $('result').innerHTML = '<div class="loading" style="margin-top:14px">Loading the ' + esc(ST.year) + ' season…</div>';
      Promise.all([ensureSeason(ST.year), ensurePlayers()]).then(function () { renderSetup(); renderResult(); }, function () {
        $('result').innerHTML = '<div class="cc-msg err" style="margin-top:14px">The NFL stats could not be loaded from Sleeper right now. <button type="button" class="btn sm" id="retry">Try again</button></div>';
      });
      return;
    }
    renderResult();
  }
  document.addEventListener('click', function (e) {
    var t = e.target, b;
    if ((b = t.closest('[data-year]'))) { ST.year = Number(b.dataset.year); ST.shown = 40; update(); return; }
    if ((b = t.closest('[data-base]'))) { ST.base = b.dataset.base; update(); return; }
    if ((b = t.closest('[data-td]'))) { ST.passTd = Number(b.dataset.td); update(); return; }
    if ((b = t.closest('[data-tep]'))) { ST.tep = Number(b.dataset.tep); update(); return; }
    if ((b = t.closest('[data-teams]'))) { ST.teams = Number(b.dataset.teams); update(); return; }
    if ((b = t.closest('[data-sf]'))) { ST.sf = b.dataset.sf === '1'; update(); return; }
    if ((b = t.closest('[data-card]')) && window.DHQPlayerCard) {
      var lgOn = !!(ST.lg && ST.lg.site === 'sleeper' && ST.lg.rosters.length);
      DHQPlayerCard.open(b.getAttribute('data-card'), { leagueId: lgOn ? ST.lg.league.league_id : undefined, league: lgOn, scoringSettings: rules() });
      visit('card_opened', { entityType: 'player', entityId: b.getAttribute('data-card') });
      return;
    }
    if ((b = t.closest('[data-why]'))) { ST.why = ST.why === b.dataset.why ? null : b.dataset.why; renderResult(); var again = document.querySelector('[data-why="' + b.dataset.why + '"]'); if (again) again.focus({ preventScroll: true }); return; }
    if ((b = t.closest('[data-rtab]'))) {
      ST.rtab = b.dataset.rtab;
      document.querySelectorAll('[data-rtab]').forEach(function (x) { var on = x.dataset.rtab === ST.rtab; x.classList.toggle('on', on); x.setAttribute('aria-selected', on); });
      document.querySelectorAll('[data-rpanel]').forEach(function (x) { x.hidden = x.dataset.rpanel !== ST.rtab; });
      return;
    }
    if ((b = t.closest('[data-pos]'))) { ST.pos = b.dataset.pos; ST.shown = 40; update(true); return; }
    if ((b = t.closest('[data-preset]'))) {
      var o = PRESETS[Number(b.dataset.preset)].o;
      if (presetOn(o)) presetKeys(o).forEach(function (k) { delete ST.draft[k]; });
      else Object.keys(o).forEach(function (k) { ST.draft[k] = o[k]; });
      cleanProposal(); renderSetup(); return;
    }
    if ((b = t.closest('[data-unset]'))) { delete ST.draft[b.dataset.unset]; renderSetup(); return; }
    if (t.id === 'clearAll') { ST.draft = {}; ST.proposal = {}; ST.watch = []; ST.wteams = []; ST.why = null; update(); toast('Cleared: no changes, no players.'); return; }
    if (t.id === 'moreWatch') { ST.watchAll = !ST.watchAll; renderSetup(); return; }
    if (t.id === 'applyBtn') { ST.proposal = copyOf(ST.draft); ST.shown = 40; update(); toast(Object.keys(ST.proposal).length ? 'Changes added. Results below.' : 'Changes cleared.'); var rs = $('result'); if (rs && rs.scrollIntoView) rs.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (t.id === 'ruleAdd') {
      var k = $('ruleKey').value, raw = String($('ruleVal').value).trim(), v = Number(raw);
      ST.ruleSel = k;
      if (raw === '' || !isFinite(v)) { toast('Type a number for the new value.'); return; }
      if (Math.abs((Number(rules()[k]) || 0) - v) < 1e-9) { delete ST.draft[k]; toast('That is already your rule.'); } else { ST.draft[k] = v; toast('On the list. Press Add changes when you\u2019re ready.'); }
      renderSetup(); return;
    }
    if (t.id === 'more') { ST.shown += 60; renderResult(); return; }
    if (t.id === 'sweepBtn') { runSweep(); return; }
    if (t.id === 'copySum') { copy(summaryText(), 'Copied. Paste it into the league chat.'); return; }
    if (t.id === 'copyLink') { copy(location.href, 'Link copied. It opens this exact comparison.'); return; }
    if (t.id === 'retry') { update(); return; }
    if (t.id === 'lgFind') { if (ST.site === 'sleeper') findLeagues($('lgq').value); else findSite($('lgq').value); return; }
    if ((b = t.closest('[data-site]'))) { if (ST.site !== b.dataset.site) { ST.site = b.dataset.site; ST.lgList = null; ST.lgQ = ''; ST.lgMsg = ''; renderSetup(); var q = $('lgq'); if (q) q.focus(); } return; }
    if ((b = t.closest('[data-lg]'))) { lgMsg('<span class="loading">Opening the league\u2026</span>'); openLeague(b.dataset.lg).then(function () { ST.proposal = {}; ST.draft = {}; update(); }, lgFail); return; }
    if (t.id === 'lgOff') { ST.wteams = []; ST.lg = null; ST.proposal = {}; ST.draft = {}; update(); return; }
    if ((b = t.closest('[data-padd]'))) {
      var q0 = $('pq') ? $('pq').value : '', sc = $('psug') ? $('psug').scrollTop : 0;
      if (ST.watch.indexOf(b.dataset.padd) < 0) { ST.watch.push(b.dataset.padd); toast((ST.players[b.dataset.padd] || [b.dataset.padd])[0] + ' added. Tap \u201cDone\u201d to see the results.'); }
      update(true);
      if (ST.wpos) { $('pq').value = q0; drawSug(); $('psug').scrollTop = sc; } else if ($('pq')) $('pq').focus();
      return;
    }
    if (t.id === 'sugDone') {
      ST.wpos = null; renderSetup();
      var yp = [].slice.call(document.querySelectorAll('#result h3')).filter(function (h) { return /player scoring changes/i.test(h.textContent); })[0];
      if (yp) { var rd = $('result').querySelector('[data-rpanel="sum"]'); if (rd && rd.hidden) { ST.rtab = 'sum'; document.querySelector('[data-rtab="sum"]').click(); } yp.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      return;
    }
    if ((b = t.closest('[data-wpos]'))) { ST.wpos = ST.wpos === b.dataset.wpos ? null : b.dataset.wpos; var q1 = $('pq') ? $('pq').value : ''; renderSetup(); if ($('pq')) $('pq').value = q1; drawSug(); return; }
    if ((b = t.closest('[data-unwatch]'))) { ST.watch = ST.watch.filter(function (x) { return x !== b.dataset.unwatch; }); update(true); return; }
    if (t.id === 'clearWatch') { ST.watch = []; ST.wteams = []; update(true); return; }
    if ((b = t.closest('[data-unteam]'))) { ST.wteams = ST.wteams.filter(function (x) { return String(x) !== b.dataset.unteam; }); update(true); return; }
    if (!t.closest('.psearch') && !t.closest('.wpos') && $('psug')) $('psug').hidden = true;
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'pq') drawSug(); });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.why) { e.preventDefault(); e.target.click(); return; }
    if (e.key === 'Enter' && e.target.id === 'lgq') { e.preventDefault(); if (ST.site === 'sleeper') findLeagues(e.target.value); else findSite(e.target.value); }
    if (e.key === 'Enter' && e.target.id === 'pq') { e.preventDefault(); var f = document.querySelector('#psug [data-padd]'); if (f) f.click(); }
    if (e.key === 'Escape' && e.target.id === 'pq') { $('psug').hidden = true; }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id !== 'teamPick' || !e.target.value || !ST.lg) return;
    var r = ST.lg.rosters.filter(function (x) { return String(x.roster_id) === e.target.value; })[0];
    if (r) { ST.wteams = ST.wteams.filter(function (x) { return x !== String(r.roster_id); }); ST.wteams.unshift(String(r.roster_id)); }
    update(true);
    if (r) showTeam(r.roster_id);
  });
  window.addEventListener('hashchange', function () { fromLink(hashParams()); });

  // ── Boot: this season once it has games, and last season ─────────────
  getJSON(SL + '/state/nfl').then(function (s) { return s; }, function () { return null; }).then(function (s) {
    var now = new Date().getFullYear();
    ST.state = s || { season: String(now), week: 1 };
    var yr = Number(ST.state.season) || now, live = (Number(ST.state.week) > 1 && ST.state.season_type === 'regular') || ST.state.season_type === 'post';
    ST.years = live ? [yr, yr - 1] : [yr - 1, yr - 2];
    ST.year = ST.years[0];
    var h = hashParams();
    fromLink(h);
  });
})();
</script>
<script>
/* Front Door tracking (owner ask 2026-11-20): a scoring rule changed (a preset, a new value, the
   base scoring buttons, or "Add changes"), at most once per 30 s. Listens only. */
(function () {
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest || !window.DHQVisit) return;
    var how = t.id === 'applyBtn' ? 'apply' : t.id === 'ruleAdd' ? 'value' : t.closest('[data-preset]') ? 'preset'
      : t.closest('[data-base],[data-td],[data-tep]') ? 'scoring' : null;
    if (how) { try { window.DHQVisit.track('tool_used', { meta: { action: 'rule_changed', how: how } }); } catch (x) { /* never in the way */ } }
  }, true);
})();
</script>
</body>
</html>
