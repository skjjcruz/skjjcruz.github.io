<title>Start Sit Advice · Dynasty HQ</title>
<meta name="description" content="Put any players side by side and DHQ tells you who to start this week, with DHQ's projection and the full formula behind it. Free, no sign-up.">

<!--
  DHQ Start Sit Advice, Lab edition (owner design 2026-11-13).
  Headshots across the top, one column under each player with every weekly
  projection metric as bullets. The call is the WEEKLY PROJECTION only:
  highest DHQ projection this week (in the visitor's scoring) gets the
  START, a gold box around his headshot and his score at the top of his
  column. DHQ Value sits by the photo for reference and never decides.
  Same data as lab/projections.html (copied from it so the numbers always
  match): the week's lock file and its formula file, the scoreboard
  relay (opponent, home / away, byes), Sleeper's stats (last week, season)
  and the engine server's DHQ values. Published to the Lab as startsit.html
  by scripts/publish-lab.cjs and gated like every page.
-->
<style>
/* Look: the projections page's Trade Builder panel, plus the start / sit board. */
:root{
  color-scheme:dark;
  --page:#08080B; --off-black:#1B1B22; --panel:rgba(16,16,22,.96); --charcoal:#27262E;
  --white:#F5F2EA; --silver:#BDB8AD; --soft:rgba(207,207,214,.88); --faint:rgba(189,184,173,.6);
  --gold:#D4AF37; --good:#2ECC71; --warn:#F0A500; --bad:#E74C3C; --info:#5DADE2;
  --send:#5dade2; --get:#e74c3c;
  --line:rgba(212,175,55,.16); --line2:rgba(212,175,55,.25); --hair:rgba(255,255,255,.06);
  --r-xs:5px; --r-sm:8px; --r:10px; --r-lg:14px;
  --display:'Rajdhani','Arial Narrow',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{background:var(--page)}
body{margin:0;color:var(--white);font:14.5px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.brandwash{position:fixed;inset:0;z-index:0;pointer-events:none;background:url("img/logo.png") no-repeat center 16%/min(720px,86vw) auto;opacity:.07;mix-blend-mode:screen;filter:blur(4px);-webkit-mask-image:radial-gradient(125% 105% at 50% 20%,#000 26%,transparent 74%);mask-image:radial-gradient(125% 105% at 50% 20%,#000 26%,transparent 74%)}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:calc(12px + var(--sat)) 12px;box-shadow:0 0 0 100vmax var(--page),0 1px 0 100vmax #ffffff18;clip-path:inset(0 -100vmax -1px)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--white)}
.brand img{width:44px;height:44px;border-radius:var(--r);box-shadow:0 2px 12px rgba(212,175,55,.3)}
.brand span{font:700 20px/1 var(--display);letter-spacing:.06em}
.back{color:#98A1AD;text-decoration:none;font-size:14px;padding:10px 14px;border:1px solid #232932;border-radius:var(--r-sm)}
.back:hover{color:var(--white);border-color:#333A45}

/* the panel */
.panel{margin:28px 0 0;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:18px 20px 20px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid rgba(212,175,55,.12)}
.panel-head h1,.panel-head h2{margin:0;color:var(--gold);font:700 19px/1.1 var(--display);letter-spacing:.1em;text-transform:uppercase}
.panel-head em{color:var(--faint);font-size:13.5px}
.source{margin:14px 0;color:var(--soft);font-size:14px}
.source b{color:var(--gold);font-weight:600}
.source .est{color:var(--faint)}

.sel{background:var(--charcoal);border:1px solid var(--line2);color:var(--white);font:500 13.5px var(--body);padding:9px 10px;border-radius:var(--r-xs);cursor:pointer;width:100%}
.sel:focus{outline:none;border-color:var(--gold)}
.league{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.foot-note{margin:16px 0 40px;font-size:12px;line-height:1.6;color:var(--faint)}
.loading{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:13.5px;padding:12px}
.loading::before{content:"";width:13px;height:13px;border-radius:50%;border:2px solid var(--gold);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#F1948A;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;background:var(--off-black);border:1px solid var(--line2);padding:10px 16px;border-radius:var(--r-sm);font-size:14px;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.wrap{max-width:1240px}
.face{width:32px;height:32px;border-radius:50%;flex:none;overflow:hidden;background:#15151b;box-shadow:0 0 0 1.5px var(--pc,var(--silver));display:inline-block;position:relative}
.face img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 15%}

/* ── the add-player menu ── */
.ss-tools{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 12px;margin:4px 0 16px}
.ss-tools > .ss-count{line-height:46px}
.ss-find{position:relative;flex:1;min-width:240px}
.ss-find input{width:100%;background:var(--charcoal);border:1px solid var(--line2);color:var(--white);font:400 15px var(--body);padding:12px 14px 12px 40px;border-radius:var(--r-sm)}
.ss-find input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
.ss-find input::placeholder{color:rgba(255,255,255,.3)}
.ss-find input:disabled{opacity:.5;cursor:not-allowed}
.ss-find > svg{position:absolute;left:13px;top:23px;width:17px;height:17px;transform:translateY(-50%);stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.ss-pos{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px}
.ss-pos-k{font:600 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.ss-pos button{border:1px solid var(--line2);background:var(--charcoal);color:var(--silver);font:600 12.5px var(--body);letter-spacing:.04em;padding:6px 11px;border-radius:var(--r-xs);cursor:pointer}
.ss-pos button:hover{color:var(--white);border-color:rgba(212,175,55,.45)}
.ss-pos button[aria-pressed="true"]{background:rgba(212,175,55,.16);color:var(--gold);border-color:rgba(212,175,55,.55)}
.ss-pos button:disabled{opacity:.4;cursor:not-allowed}
.ss-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:#1d1c23;border:1px solid rgba(212,175,55,.3);border-radius:var(--r-sm);box-shadow:0 18px 50px rgba(0,0,0,.55);max-height:min(420px,60vh);overflow-y:auto;padding:4px}
.ss-menu[hidden]{display:none}
.ss-mbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ss-mbar .ss-mhead{flex:1;min-width:0}
.ss-mdone{flex:none;min-height:36px;padding:0 14px;margin:4px;border:1px solid rgba(212,175,55,.45);background:rgba(212,175,55,.1);color:var(--gold);border-radius:var(--r-xs);font:700 13px var(--body);cursor:pointer}
.ss-mhead{padding:8px 10px 6px;font:600 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.ss-menu{touch-action:pan-y}
.ss-opt{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:transparent;border-radius:var(--r-xs);text-align:left;cursor:pointer}
.ss-opt .face{width:34px;height:34px}
.ss-opt b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-opt small{display:block;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-opt em{font-style:normal;font:700 14px var(--body);color:var(--gold);font-variant-numeric:tabular-nums;text-align:right}
.ss-opt em small{font:600 9px var(--body);letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.ss-opt[aria-selected="true"],.ss-opt:hover{background:rgba(212,175,55,.1)}
.ss-opt.on{opacity:.35;pointer-events:none}
.ss-none{padding:14px 10px;font-size:13.5px;color:var(--faint)}
.ss-btn{background:transparent;border:1px solid var(--line2);color:var(--silver);font:600 13px var(--body);padding:11px 14px;border-radius:var(--r-sm);cursor:pointer;white-space:nowrap}
.ss-btn:hover{color:var(--white);border-color:rgba(212,175,55,.45)}
.ss-btn[hidden]{display:none}
.ss-count{font-size:12px;color:var(--faint);white-space:nowrap}

/* ── the call ── */
.ss-call{display:flex;align-items:center;gap:16px;margin:0 0 16px;padding:14px 18px;border:1px solid rgba(212,175,55,.45);border-radius:var(--r);background:linear-gradient(100deg,rgba(212,175,55,.16),rgba(212,175,55,.03) 70%);box-shadow:0 10px 34px rgba(0,0,0,.3)}
.ss-call[hidden]{display:none}
.ss-call .face{width:54px;height:54px;box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(212,175,55,.35)}
.ss-call-txt{display:grid;gap:3px;min-width:0}
.ss-call-k{font:700 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.ss-call-h{font:700 26px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--white)}
.ss-call-h span{color:var(--gold)}
.ss-call-s{font-size:13.5px;color:var(--soft)}
.ss-call-s b{color:var(--white);font-weight:600}
.ss-call-c{font-size:12.5px;color:var(--faint)}
.ss-call-c b{color:#7DDCA3;font-weight:600} .ss-call-c i{font-style:normal;color:#F1948A;font-weight:600}
.ss-call.even{border-color:var(--line2);background:var(--charcoal)}
.ss-call.even .ss-call-k{color:var(--silver)}

/* ── the board: one column per player ── */
/* centered on the page (owner 2026-11-13): columns up to 400px wide, the group in the middle */
.ss-board{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,400px));justify-content:center;gap:14px;position:relative;align-items:start}
.ss-col{position:relative;display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(39,38,46,.85),rgba(22,22,28,.92));overflow:hidden}
.ss-col.win{border-color:rgba(212,175,55,.7);box-shadow:0 0 0 1px rgba(212,175,55,.25),0 18px 50px rgba(212,175,55,.12)}
.ss-x{position:absolute;top:8px;right:8px;z-index:2;width:28px;height:28px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.1);border-radius:50%;background:rgba(0,0,0,.35);color:var(--faint);cursor:pointer;font-size:15px;line-height:1}
.ss-x:hover{color:var(--white);border-color:rgba(231,76,60,.6)}

/* the score at the top of the column */
.ss-titlebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ss-wk{display:inline-flex;align-items:center;padding:4px 11px;border:1px solid rgba(212,175,55,.5);border-radius:999px;background:rgba(212,175,55,.12);color:var(--gold);font:700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.ss-game{padding:9px 38px 9px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font:600 12px/1.35 var(--body);letter-spacing:.04em;color:var(--soft);border-bottom:1px solid var(--hair);background:rgba(255,255,255,.025)}
.ss-game b{color:var(--white);font-weight:700}
@media (max-width:640px){.ss-game{padding:8px 34px 8px 10px;font-size:11.5px;white-space:normal}.ss-game .wk{display:block;font:700 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}.ss-game .sep{display:none}.ss-game .kt{display:block}}
.win .ss-game{background:rgba(212,175,55,.1);border-bottom-color:rgba(212,175,55,.3)}
.ss-top{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:10px 40px;border-bottom:1px solid var(--hair);background:rgba(255,255,255,.02)}
.ss-tag{font:700 11.5px var(--body);letter-spacing:.16em;text-transform:uppercase;padding:5px 9px;border-radius:var(--r-xs);background:rgba(255,255,255,.06);color:var(--silver)}
.ss-score{font:700 30px/1 var(--display);color:var(--white);font-variant-numeric:tabular-nums}
.ss-score small{font:600 11px var(--body);letter-spacing:.08em;color:var(--faint);margin-left:3px}
.ss-gap{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.win .ss-top{background:linear-gradient(180deg,rgba(212,175,55,.24),rgba(212,175,55,.08));border-bottom-color:rgba(212,175,55,.35)}
.win .ss-tag{background:var(--gold);color:#17140a}
.win .ss-score{color:var(--gold)}
.ss-top.none .ss-score{font-size:20px;color:var(--faint)}

/* headshot (gold box on the START) and the DHQ Value chip beside it */
.ss-head{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 14px 12px;text-align:center}
.ss-shot{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:10px}
.ss-frame{position:relative;width:128px;height:128px;border-radius:var(--r-lg);overflow:hidden;background:radial-gradient(120% 90% at 50% 10%,#2d2c35,#141419);box-shadow:inset 0 0 0 2px var(--pc,var(--silver));flex:none}
.ss-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 12%}
.ss-frame .ini{position:absolute;inset:0;display:grid;place-items:center;font:700 34px var(--display);color:rgba(255,255,255,.25)}
.win .ss-frame{box-shadow:inset 0 0 0 3px var(--gold),0 0 0 4px rgba(212,175,55,.18),0 0 34px rgba(212,175,55,.35)}
.ss-crown{position:absolute;top:-9px;left:50%;transform:translateX(-50%);z-index:1;padding:3px 9px;border-radius:999px;background:var(--gold);color:#17140a;font:700 9.5px var(--body);letter-spacing:.14em;text-transform:uppercase;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap}
.ss-val{display:grid;gap:1px;padding:7px 9px;border:1px solid var(--line2);border-radius:var(--r-sm);background:rgba(0,0,0,.25);text-align:left;min-width:66px}
.ss-val span{font:600 8.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.ss-val b{font:700 17px/1.1 var(--display);color:var(--white);font-variant-numeric:tabular-nums}
.ss-frame[data-card],.ss-name[data-card]{cursor:pointer}
.ss-name[data-card]:hover{color:var(--gold)}
.ss-card{margin-top:8px;border:1px solid rgba(212,175,55,.45);background:rgba(212,175,55,.08);color:var(--gold);font:600 12.5px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.ss-card:hover{background:rgba(212,175,55,.16)}
.ss-name{font:700 22px/1.1 var(--display);letter-spacing:.03em;color:var(--white);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-sub{font-size:12.5px;color:var(--faint)}
.ss-sub b{font-weight:700}
.ss-flag{display:inline-block;margin-top:2px;padding:3px 8px;border-radius:var(--r-xs);font:700 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase}
.ss-flag.bad{background:rgba(231,76,60,.16);color:#F1948A}
.ss-flag.warn{background:rgba(240,165,0,.14);color:var(--warn)}
.ss-flag.info{background:rgba(93,173,226,.14);color:var(--info)}

/* the bullets */
.ss-sec{padding:4px 16px 14px}
.ss-sec h3{margin:10px 0 6px;font:600 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.ss-list{list-style:none;margin:0;padding:0;display:grid}
.ss-list li{position:relative;display:flex;align-items:baseline;gap:8px;padding:6px 0 6px 14px;border-bottom:1px solid var(--hair);font-size:13px;min-height:33px}
.ss-list li::before{content:"";position:absolute;left:0;top:13px;width:5px;height:5px;border-radius:50%;background:rgba(212,175,55,.55)}
.ss-list li:last-child{border-bottom:0}
.ss-list .k{color:var(--soft);flex:none}
.ss-list .dots{flex:1;min-width:8px;border-bottom:1px dotted rgba(255,255,255,.12);transform:translateY(-3px)}
.ss-list .v{color:var(--white);font-weight:600;text-align:right;font-variant-numeric:tabular-nums;min-width:0}
.ss-list .v.lead{color:#7DDCA3;white-space:nowrap}
.ss-list .v.lead::after{content:" \25B2";font-size:8px;vertical-align:2px}
.ss-list .v.dim{color:var(--faint);font-weight:500}
.ss-list .v.dhq{color:var(--gold);font-size:15px}
.ss-list .v.bye{color:var(--warn)}
.ss-list li.wide{display:block;align-content:start}
.ss-list li.wide .k{display:block}
.ss-list li.wide .v{display:block;text-align:left;margin-top:2px;font-weight:500;color:var(--white);line-height:1.4}
.ss-reads li{display:block;padding-left:18px}
.ss-reads li::before{display:none}
.ss-reads .ar{position:absolute;left:0;top:7px;font-size:10px}
.ss-reads .up .ar{color:#7DDCA3} .ss-reads .dn .ar{color:#F1948A}
.ss-reads b{font-weight:600;color:var(--white)}
.ss-reads .pc{font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}
.ss-reads .up .pc{color:#7DDCA3} .ss-reads .dn .pc{color:#F1948A}
.ss-reads small{display:block;color:var(--faint);font-size:12px;line-height:1.4;margin-top:1px}

/* an open slot: click to add */
.fx{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.ss-sec{min-width:0}
.fx > li{position:relative;padding:8px 0;border-bottom:1px solid var(--hair);font-size:12.5px}
.fx > li:last-child{border-bottom:0}
.fx-row{display:flex;align-items:baseline;gap:6px}
.fx-k{color:var(--white);font-weight:600;min-width:0}
.fx-w{flex:none;font:600 9.5px var(--mono);color:var(--faint);border:1px solid var(--hair);border-radius:var(--r-xs);padding:1px 4px;letter-spacing:.02em}
.fx-p{margin-left:auto;flex:none;font-weight:700;font-variant-numeric:tabular-nums;color:var(--soft)}
.fx-v{margin-left:auto;flex:none;font:700 17px/1 var(--display);color:var(--white);font-variant-numeric:tabular-nums}
.fx small{display:block;margin-top:3px;color:var(--faint);font-size:11.5px;line-height:1.4}
.fx .fx-x{color:var(--soft)}
.fx-f.up .fx-p,.fx-p.pu{color:#7DDCA3} .fx-f.dn .fx-p,.fx-p.pd{color:#F1948A}
.fx-f.out .fx-p{color:#F1948A} .fx-f.nod .fx-p,.fx-f.flat .fx-p{color:var(--faint);font-weight:600}
.fx-f.nod .fx-k{color:var(--faint)}
.fx-bar{position:relative;height:3px;margin:5px 0 1px;background:rgba(255,255,255,.05);border-radius:2px}
.fx-bar::after{content:"";position:absolute;left:50%;top:-2px;width:1px;height:7px;background:rgba(255,255,255,.18)}
.fx-bar i{position:absolute;top:0;height:100%;border-radius:2px;background:var(--faint)}
.fx-f.up .fx-bar i{background:#7DDCA3} .fx-f.dn .fx-bar i{background:#F1948A}
.fx-s{background:rgba(255,255,255,.025);margin:0 -8px;padding:8px!important;border-radius:var(--r-xs)}
.fx-base{margin-top:2px!important}
.fx-eq{margin-top:3px;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.fx-eq b{color:var(--white)}

<script>
(function () {
  // ── Source league: the engine server's finished values ───────────────────
  // The Psycho League (Sleeper): 16 teams, Superflex, Half-PPR, IDP. Owner
  // ruling 2026-11-10: its values as-is; the toggles refine them.
  var SOURCE = { id: '1312100327931019264', teams: 16, qb: 'sf', scoring: 'half', tep: '0' };
  var VALUES_URL = 'https://hovnqztlbsgsywrbidbh.supabase.co/functions/v1/dhq-league?league=' + SOURCE.id;
  var PLAYERS_URL = 'https://api.sleeper.app/v1/players/nfl';
  var VALUES_KEY = 'dhq_tc_values_v1', PLAYERS_KEY = 'dhq_tc_players_v1', PREF_KEY = 'dhq_tc_league_v1', STATS_KEY = 'dhq_tc_stats_v2';   // v2: the rows lab/projections.html keeps (+ defenders' IDP stats)
  // This season's actual points and games (Sleeper season stats, the same feed the app reads; actual results, not projections).
  var SEASON = 2026, STATS_URL = 'https://api.sleeper.app/v1/stats/nfl/regular/' + SEASON, STATS_TTL = 6 * 3600e3;
  var STATS = {};
  // Defenders (launch QA 2026-11-17, as lab/projections.html): Sleeper's pts_* leave IDP stats out, so a
  // DL / LB / DB is scored from his raw IDP stats with the default league's IDP rules (its idp_* keys and
  // defensive bonuses), cached a day; his projection is the lock's copy for that league (the same rules).
  var LEAGUE_URL = 'https://api.sleeper.app/v1/league/' + SOURCE.id, IDPR_KEY = 'dhq_tc_idp_rules_v1';
  var IDPR = { idp_tkl_solo: 0.5, idp_tkl_ast: 0.25, idp_tkl_loss: 2, idp_sack: 5, idp_sack_yd: 0.1, idp_qb_hit: 1.25, idp_int: 5, idp_int_ret_yd: 0.1, idp_pass_def: 5, idp_pass_def_3p: 1, idp_ff: 3, idp_fum_rec: 3, idp_fum_ret_yd: 0.1, idp_def_td: 6, idp_safe: 2, idp_blk_kick: 3 }; // the league's rules on 2026-11-17, used if Sleeper cannot be reached
  var idprLoading = null;
  function isDefKey(k) { return /^idp_/.test(k) || /^bonus_(tkl|sack|def)_/.test(k); }
  function defLine(l) { var o = {}; Object.keys(l || {}).forEach(function (k) { if (isDefKey(k) && l[k]) o[k] = l[k]; }); return o; }
  function loadIdpRules() {
    if (idprLoading) return idprLoading;
    var c = load(IDPR_KEY);
    if (c && c.rules && Date.now() - c.ts < 86400e3) { IDPR = c.rules; return (idprLoading = Promise.resolve(IDPR)); }
    return (idprLoading = getJSON(LEAGUE_URL).then(function (lg) {
      var r = defLine(lg && lg.scoring_settings);
      if (Object.keys(r).length) { IDPR = r; store(IDPR_KEY, { ts: Date.now(), rules: r }); }
      return IDPR;
    }).catch(function () { if (c && c.rules) IDPR = c.rules; return IDPR; }));
  }
  function idpPts(line) { var t = 0; for (var k in IDPR) if (line && line[k]) t += line[k] * IDPR[k]; return t; }
  // This week's bye teams: the app's scoreboard relay (ESPN's slate, nfl-scoreboard) for the current NFL week.
  var STATE_URL = 'https://api.sleeper.app/v1/state/nfl', SCOREBOARD_URL = 'https://sxshiqyxhhifvtfqawbq.supabase.co/functions/v1/nfl-scoreboard', BYE_KEY = 'dhq_tc_bye_v1';
  var BYE = {}, ESPN_TEAM = { WSH: 'WAS', JAC: 'JAX', LA: 'LAR' };
  function loadByes() {
    var c = load(BYE_KEY);
    if (c && Date.now() - c.ts < 3 * 3600e3) { BYE = c.teams || {}; return Promise.resolve(); }

      if (!st || st.season_type !== 'regular' || !st.week) return {};
      return getJSON(SCOREBOARD_URL + '?week=' + st.week + '&seasontype=2').then(function (sb) {
        var out = {}; ((sb.week && sb.week.teamsOnBye) || []).forEach(function (t) { var a = String(t.abbreviation || '').toUpperCase(); out[ESPN_TEAM[a] || a] = st.week; });
        return out;

    }).then(function (teams) { BYE = teams || {}; store(BYE_KEY, { ts: Date.now(), teams: BYE }); }).catch(function () { BYE = (c && c.teams) || {}; });

  var IDP = { DL: 1, LB: 1, DB: 1, DE: 1, DT: 1, CB: 1, S: 1, ILB: 1, OLB: 1 };

  var $ = function (id) { return document.getElementById(id); };

  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* full or blocked: run without */ } }

  var tt; function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('on'); }, 2400); }

  var S = { scoring: 'ppr', qb: 'sf', tep: '0', teams: '12', idp: '0' };
  Object.assign(S, load(PREF_KEY) || {});
  var DATA = null;      // { builtAt, week, values:{pid:[value, age, projMedian, ppg]}, picks:{overall:value} }
  var PLAYERS = null;   // { pid: [name, pos, team] }
  var SEARCH = [];      // [{ id, name, pos, team, base }]
  // ── Refinements (owner 2026-11-10): estimated, on top of the server values ─
  // Position factors from the source league's format to the visitor's. They
  // never touch picks' order and never exceed the 10,000 scale.
  function factor(pos, base) {
    var f = 1;
    var sc = { ppr: { RB: 1.03, WR: 1.06, TE: 1.06 }, half: {}, std: { RB: 0.98, WR: 0.93, TE: 0.93 } };

  // ── Data loading (finished numbers only; nothing is computed here) ───────
  function slimValues(d) {
    var out = { builtAt: d.built_at, week: d.dhq_proj && d.dhq_proj.week, values: {}, picks: {} };
    var ps = (d.intel && d.intel.playerScores) || {}, pm = (d.intel && d.intel.playerMeta) || {}, pj = (d.dhq_proj && d.dhq_proj.players) || {};

      var v = ps[pid]; if (!(v > 0)) return;
      var m = pm[pid] || {}, j = pj[pid] || {};

    });

    Object.keys(pv).forEach(function (n) { if (pv[n] && pv[n].value > 0) out.picks[n] = pv[n].value; });

      head = pos ? 'Top projected ' + pos + 's this week' : 'Top projected this week';
    }
    M.list = pool.map(function (p) { var i2 = W && W.info[p.id], tm = teamKey((i2 && i2.team) || p.team), bye = !!(W && W.slate && W.slate.ok && W.slate.bye[tm]); return { p: p, x: bye ? null : projOf(p), bye: bye, v: playerValue(p.id) }; })
      .sort(function (a, b) { return (b.x == null ? -1 : b.x) - (a.x == null ? -1 : a.x) || b.v - a.v || a.p.name.localeCompare(b.p.name); }).slice(0, cap);
    M.at = firstOpen(0, 1);
    var html = '<div class="ss-mbar" role="presentation">' + (head ? '<div class="ss-mhead">' + head + '</div>' : '<div class="ss-mhead"></div>') + '<button type="button" class="ss-mdone" data-done>Done</button></div>';
    html += M.list.length ? M.list.map(function (r, i) {
      var p = r.p, i2 = W && W.info[p.id], tm = teamKey((i2 && i2.team) || p.team), on = PICKS.indexOf(p.id) >= 0;
      var opp = W && W.slate && !r.bye && W.slate.opp[tm] ? (W.slate.away[tm] ? '@' : 'vs ') + W.slate.opp[tm] : '';   // a bye shows once, on the right
      return '<button type="button" class="ss-opt' + (on ? ' on' : '') + '" role="option" tabindex="-1" id="opt' + i + '" data-id="' + esc(p.id) + '" aria-selected="' + (i === M.at) + '"' + (on ? ' aria-disabled="true"' : '') + '>'
        + face(p.id, POS_COLOR[p.pos] || 'var(--silver)') + '<span><b>' + esc(p.name) + (on ? ' (added)' : '') + '</b><small>' + esc(p.pos + ' · ' + tm + (opp ? ' · ' + opp : '')) + '</small></span>'
        + '<em>' + (r.bye ? '<small>Bye</small>' : (r.x != null ? r.x.toFixed(1) : '–') + '<small> DHQ</small>') + '</em></button>';
    }).join('') : '<div class="ss-none" role="presentation">No player matches "' + esc($('q').value.trim()) + '".</div>';
    $('menu').innerHTML = html; $('menu').hidden = false; $('q').setAttribute('aria-expanded', 'true');
    $('q').setAttribute('aria-activedescendant', M.at >= 0 ? 'opt' + M.at : '');
  }
  function closeMenu() { $('menu').hidden = true; $('q').setAttribute('aria-expanded', 'false'); $('q').removeAttribute('aria-activedescendant'); }
  function mark() {
    document.querySelectorAll('#menu .ss-opt').forEach(function (b, i) { b.setAttribute('aria-selected', String(i === M.at)); if (i === M.at && b.scrollIntoView) b.scrollIntoView({ block: 'nearest' }); });
    $('q').setAttribute('aria-activedescendant', M.at >= 0 ? 'opt' + M.at : '');
  }
  // The next row that is not already on the board, from i going dir (+1 / -1).
  function firstOpen(i, dir) {
    for (; i >= 0 && i < M.list.length; i += dir) if (PICKS.indexOf(M.list[i].p.id) < 0) return i;
    return -1;
  }
  function add(pid) {
    if (!pid || PICKS.indexOf(pid) >= 0 || PICKS.length >= MAX_PICKS || !valid(pid)) return;
    PICKS.push(pid); saveState(); $('q').value = ''; render();
    if (TOUCH) { if (PICKS.length >= 2 || PICKS.length >= MAX_PICKS) closeMenu(); else drawMenu(); return; }   // touch: no keyboard; the list stays for the second pick
    if (PICKS.length < MAX_PICKS) { drawMenu(); $('q').focus(); } else { closeMenu(); $('share').focus(); }   // the box is disabled at four
  }
  $('q').addEventListener('input', drawMenu);
  $('posSeg').addEventListener('mousedown', function (e) { if (e.target.closest('[data-pos]')) e.preventDefault(); });   // keep focus in the box
  $('posSeg').addEventListener('click', function (e) {
    var b = e.target.closest('[data-pos]'); if (!b || b.disabled) return;
    M.pos = M.pos === b.dataset.pos ? null : b.dataset.pos;   // tap again to clear
    drawPos();
    if (!DATA || !W) return;
    if (M.pos) { $('menu').scrollTop = 0; drawMenu(); focusBox(); } else closeMenu();
  });
  $('q').addEventListener('focus', function () { if (DATA && W) drawMenu(); });
  $('q').addEventListener('keydown', function (e) {
    // a closed menu: arrows and Enter only open it (Enter never adds a player you did not see)
    if ($('menu').hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter')) { e.preventDefault(); drawMenu(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); var dn = firstOpen(M.at + 1, 1); if (dn >= 0) { M.at = dn; mark(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); var up = firstOpen(M.at - 1, -1); if (up >= 0) { M.at = up; mark(); } }
    else if (e.key === 'Enter') { e.preventDefault(); var r = M.list[M.at]; if (r && PICKS.indexOf(r.p.id) < 0) add(r.p.id); }
    else if (e.key === 'Escape') { e.preventDefault(); closeMenu(); }   // preventDefault: the search box would clear itself and reopen the menu
    else if (e.key === 'Tab') closeMenu();
  });
  // focus leaving the box (Tab, a click elsewhere) closes the menu
  // Touch (iPad / phone): add on finger-up instead of waiting for the browser's late "click". iPad
  // Safari takes the cursor out of the search box before it delivers the click, which closed the
  // list under the finger and swallowed the tap (owner report 2026-11-17: "have to click a player
  // multiple times"). A finger that moves (scrolling the list) adds nothing.
  var touchAdd = 0, touchAt = 0, tp = null, upX = 0, upY = 0;
  function touchStart(e) { if (e.pointerType !== 'mouse') touchAt = Date.now(); }
  $('menu').addEventListener('pointerdown', function (e) {
    touchStart(e); if (e.pointerType === 'mouse') return;
    var b = e.target.closest('.ss-opt'); tp = b ? { id: b.dataset.id, x: e.clientX, y: e.clientY, pid: e.pointerId } : null;
  });
  $('menu').addEventListener('pointermove', function (e) { if (tp && e.pointerId === tp.pid && (Math.abs(e.clientX - tp.x) > 10 || Math.abs(e.clientY - tp.y) > 10)) tp = null; });
  $('menu').addEventListener('pointercancel', function () { tp = null; });
  $('menu').addEventListener('pointerup', function (e) { if (!tp || e.pointerId !== tp.pid) return; var id = tp.id; tp = null; touchAdd = Date.now(); upX = e.clientX; upY = e.clientY; add(id); });
  $('posSeg').addEventListener('pointerdown', touchStart);
  // The browser's own "click" arrives after the finger-up add. When that add closed the list, the click
  // lands on whatever is now under the finger (a board button) and undid the pick (owner report
  // 2026-11-18). Swallow that one late click, wherever it lands.
  document.addEventListener('click', function (e) { if (Date.now() - touchAdd < 700 && Math.abs(e.clientX - upX) < 24 && Math.abs(e.clientY - upY) < 24) { e.preventDefault(); e.stopPropagation(); } }, true);
  $('find').addEventListener('focusout', function () {
    if (TOUCH) return;   // touch: the list closes with Done, a tap outside, or the second pick
    setTimeout(function () { if (Date.now() - touchAt < 1000) return; if (!$('find').contains(document.activeElement)) closeMenu(); }, 0);   // a finger on the list keeps it open
  });
  $('menu').addEventListener('mousedown', function (e) { e.preventDefault(); });   // keep focus in the box
  $('menu').addEventListener('click', function (e) { if (e.target.closest('[data-done]')) { closeMenu(); return; } if (Date.now() - touchAdd < 800) return; var b = e.target.closest('.ss-opt'); if (b) add(b.dataset.id); });   // touch already added it
  document.addEventListener('click', function (e) { if (!e.target.isConnected || e.target.closest('#find') || e.target.closest('[data-slot]')) return; closeMenu(); });

  // ── The board's buttons ──────────────────────────────────────────────────
  $('board').addEventListener('click', function (e) {
    var rm = e.target.closest('[data-rm]'), sl = e.target.closest('[data-slot]'), ex = e.target.closest('[data-ex]'), pc = e.target.closest('[data-card]');
    if (pc && window.DHQPlayerCard) { DHQPlayerCard.open(pc.dataset.card, cardOpts()); return; }
    if (e.target.closest('[data-fxtog]')) { fxToggle($('board')); equalize(); return; }
    if (rm) { PICKS = PICKS.filter(function (p) { return p !== rm.dataset.rm; }); saveState(); render(); return; }
    if (sl) { focusBox(); drawMenu(); try { (TOUCH ? $('menu') : $('find')).scrollIntoView({ block: TOUCH ? 'center' : 'nearest', behavior: 'smooth' }); } catch (x) { /* old browsers */ } return; }
    if (ex) { var all = JSON.parse($('board').dataset.ex || '[]'); PICKS = (all[+ex.dataset.ex] || []).slice(); saveState(); render(); }
  });
  $('clear').addEventListener('click', function () { PICKS = []; saveState(); render(); focusBox(); });
  $('share').addEventListener('click', function () {
    var url = location.origin + location.pathname + location.search + (PICKS.length ? '#p=' + PICKS.join(',') : '');
    var done = function () { toast('Link copied. Anyone with it sees this matchup.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function () { toast(url); }); else toast(url);
  });
  // The player card in this page's settings: the same scoring (so his projection is this column's number)
  // and the same DHQ Value as by the photo (projections.html's adjustment, done by the card's valueSettings).
  function cardOpts() {
    var PC = window.DHQPlayerCard;
    return { leagueId: SOURCE.id, scoringSettings: PC.scoringSettings ? PC.scoringSettings(S.scoring, S.tep === '1' ? 0.5 : 0) : null,
      valueSettings: { scoring: S.scoring, qb: S.qb, tep: S.tep, teams: S.teams } };
  }
  function idpFor(list) { if (PLAYERS && list.some(function (pid) { return IDP[posOf(pid)]; }) && S.idp !== '1') { S.idp = '1'; store(PREF_KEY, S); } }
  window.addEventListener('hashchange', function () { var h = hashPicks() || []; PICKS = h.slice(0, MAX_PICKS); idpFor(PICKS); render(); });

  // ── Boot ─────────────────────────────────────────────────────────────────
  PICKS = uniq(hashPicks() || load(PICK_KEY) || []).slice(0, MAX_PICKS);
  syncSel(); render();
  loadData().then(function () {
    return loadCurrent().then(function () { return CUR && CUR.week ? loadWeek(CUR.week) : { failed: true }; });
  }).then(function (w) {
    W = w;
    idpFor(PICKS);
    W && !W.failed && setTimeout(saveState, 0);   // the board you last opened (a shared link included) is the one you come back to
    render();
  }).catch(function () { $('board').innerHTML = '<p class="err">DHQ data could not be loaded right now. Check your connection and refresh the page.</p>'; });
})();
</script>
